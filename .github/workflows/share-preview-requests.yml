name: 🔎 Share preview requests

# Manual diagnosis of link previews: what the preview bots asked the VPS and got. IP addresses are hidden, this repository and its logs are public.
on:
  workflow_dispatch:

jobs:
  bot-requests:
    name: 🔎 Preview bot requests
    runs-on: ubuntu-latest
    steps:
      - name: 🔎 Print the latest preview bot requests and what could drop them
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo '--- Preview bot requests (same alias = same client address)'
            sudo sh -c 'cat /var/log/nginx/*access*.log 2>/dev/null' \
              | grep -iE 'slack|linkedinbot|facebookexternalhit|twitterbot|whatsapp|discordbot' \
              | awk '{ if (!($1 in alias)) alias[$1] = "client" (++count); $1 = alias[$1]; print }' \
              | sed -E 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/x.x.x.x/g' \
              | tail -n 150
            echo '--- Connection limits'
            echo "ufw limit rules: $(sudo ufw status 2>/dev/null | grep -c LIMIT)"
            echo "iptables rate rules: $(sudo iptables -S 2>/dev/null | grep -cE 'hitcount|connlimit|hashlimit')"
            echo "nginx limit directives: $(sudo grep -rhoE 'limit_(req|conn)[a-z_]*' /etc/nginx 2>/dev/null | sort | uniq -c | tr -s ' \n' ' ')"
            for jail in $(sudo fail2ban-client status 2>/dev/null | sed -n 's/.*Jail list:\s*//p' | tr ',' ' '); do
              echo "fail2ban $jail: $(sudo fail2ban-client status "$jail" | grep -E 'Currently banned|Total banned' | tr -s ' \t\n' ' ')"
            done
            echo '--- Latest dibodev.fr nginx errors'
            sudo sh -c 'cat /var/log/nginx/*error*.log 2>/dev/null' \
              | grep -aE 'server: (www\.)?dibodev\.fr,' \
              | grep -avE 'request: "[A-Z]+ /api/' \
              | sort \
              | sed -E 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/x.x.x.x/g' \
              | tail -n 40
