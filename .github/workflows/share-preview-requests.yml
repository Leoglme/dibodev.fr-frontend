name: 🔎 Share preview requests

# Manual diagnosis of link previews: what the preview bots asked the VPS and got. IP addresses are masked, this repository and its logs are public.
on:
  workflow_dispatch:

jobs:
  bot-requests:
    name: 🔎 Preview bot requests
    runs-on: ubuntu-latest
    steps:
      - name: 🔎 Print the latest preview bot requests
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo sh -c 'cat /var/log/nginx/*access*.log 2>/dev/null' \
              | grep -iE 'slack|linkedinbot|facebookexternalhit|twitterbot|whatsapp|discordbot' \
              | sed -E 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/x.x.x.x/g' \
              | tail -n 150
