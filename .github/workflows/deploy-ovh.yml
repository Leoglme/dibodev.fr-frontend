name: 🚀 Build and Deploy Nuxt.js 4 SSG App to OVH VPS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: 🏗️ Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v5

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📝 Setup environment file
        env:
          GSC_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          cp .env.example .env
          sed -i "s/^NODE_ENV=.*/NODE_ENV=production/" .env || echo "NODE_ENV=production" >> .env
          sed -i "s/^REPO_ACCESS_TOKEN=.*/REPO_ACCESS_TOKEN=${{ secrets.REPO_ACCESS_TOKEN }}/" .env || echo "REPO_ACCESS_TOKEN=${{ secrets.REPO_ACCESS_TOKEN }}" >> .env
          sed -i "s#^REPO_SLUG=.*#REPO_SLUG=${{ secrets.REPO_SLUG }}#" .env || echo "REPO_SLUG=${{ secrets.REPO_SLUG }}" >> .env
          sed -i "s/^MAILJET_API_KEY=.*/MAILJET_API_KEY=${{ secrets.MAILJET_API_KEY }}/" .env || echo "MAILJET_API_KEY=${{ secrets.MAILJET_API_KEY }}" >> .env
          sed -i "s/^MAILJET_API_SECRET=.*/MAILJET_API_SECRET=${{ secrets.MAILJET_API_SECRET }}/" .env || echo "MAILJET_API_SECRET=${{ secrets.MAILJET_API_SECRET }}" >> .env
          sed -i "s/^NUXT_STORYBLOK_DELIVERY_API_TOKEN=.*/NUXT_STORYBLOK_DELIVERY_API_TOKEN=${{ secrets.NUXT_STORYBLOK_DELIVERY_API_TOKEN }}/" .env || echo "NUXT_STORYBLOK_DELIVERY_API_TOKEN=${{ secrets.NUXT_STORYBLOK_DELIVERY_API_TOKEN }}" >> .env
          sed -i "s/^NUXT_PUBLIC_STORYBLOK_ACCESS_TOKEN=.*/NUXT_PUBLIC_STORYBLOK_ACCESS_TOKEN=${{ secrets.NUXT_PUBLIC_STORYBLOK_ACCESS_TOKEN }}/" .env || echo "NUXT_PUBLIC_STORYBLOK_ACCESS_TOKEN=${{ secrets.NUXT_PUBLIC_STORYBLOK_ACCESS_TOKEN }}" >> .env
          sed -i "s/^NUXT_STORYBLOK_SPACE_ID=.*/NUXT_STORYBLOK_SPACE_ID=${{ secrets.NUXT_STORYBLOK_SPACE_ID }}/" .env || echo "NUXT_STORYBLOK_SPACE_ID=${{ secrets.NUXT_STORYBLOK_SPACE_ID }}" >> .env
          sed -i "s/^NUXT_STORYBLOK_MANAGEMENT_TOKEN=.*/NUXT_STORYBLOK_MANAGEMENT_TOKEN=${{ secrets.NUXT_STORYBLOK_MANAGEMENT_TOKEN }}/" .env || echo "NUXT_STORYBLOK_MANAGEMENT_TOKEN=${{ secrets.NUXT_STORYBLOK_MANAGEMENT_TOKEN }}" >> .env
          sed -i "s/^MISTRAL_API_KEY=.*/MISTRAL_API_KEY=${{ secrets.MISTRAL_API_KEY }}/" .env || echo "MISTRAL_API_KEY=${{ secrets.MISTRAL_API_KEY }}" >> .env
          sed -i "s/^NUXT_UNSPLASH_ACCESS_KEY=.*/NUXT_UNSPLASH_ACCESS_KEY=${{ secrets.NUXT_UNSPLASH_ACCESS_KEY }}/" .env || echo "NUXT_UNSPLASH_ACCESS_KEY=${{ secrets.NUXT_UNSPLASH_ACCESS_KEY }}" >> .env
          sed -i "s/^DASHBOARD_PASSWORD=.*/DASHBOARD_PASSWORD=${{ secrets.DASHBOARD_PASSWORD }}/" .env || echo "DASHBOARD_PASSWORD=${{ secrets.DASHBOARD_PASSWORD }}" >> .env
          sed -i "s/^DASHBOARD_SESSION_TOKEN=.*/DASHBOARD_SESSION_TOKEN=${{ secrets.DASHBOARD_SESSION_TOKEN }}/" .env || echo "DASHBOARD_SESSION_TOKEN=${{ secrets.DASHBOARD_SESSION_TOKEN }}" >> .env
          sed -i "s/^PSI_API_KEY=.*/PSI_API_KEY=${{ secrets.PSI_API_KEY }}/" .env || echo "PSI_API_KEY=${{ secrets.PSI_API_KEY }}" >> .env
          sed -i "s#^NUXT_PUBLIC_POSTHOG_KEY=.*#NUXT_PUBLIC_POSTHOG_KEY=${{ secrets.NUXT_PUBLIC_POSTHOG_KEY }}#" .env || echo "NUXT_PUBLIC_POSTHOG_KEY=${{ secrets.NUXT_PUBLIC_POSTHOG_KEY }}" >> .env
          # GSC_SERVICE_ACCOUNT_JSON is multi-line JSON: write to file, minify to one line for .env
          echo "$GSC_JSON" > /tmp/gsc.json
          grep -v '^GSC_SERVICE_ACCOUNT_JSON=' .env > .env.tmp && mv .env.tmp .env
          echo "GSC_SERVICE_ACCOUNT_JSON=$(jq -c . /tmp/gsc.json)" >> .env
          rm -f /tmp/gsc.json

      - name: 🛠️ Generate Static Site (Frontend)
        run: npm run generate
        env:
          NITRO_PRESET: static
          NUXT_BUILD_COMMIT: ${{ github.sha }}

      - name: 📂 Save static site output
        run: |
          if [ -d ".output/public" ]; then
            mkdir -p tmp
            mv .output/public tmp/public-static
            echo "Static site output saved to tmp/public-static"
          else
            echo "Error: .output/public does not exist after npm run generate"
            exit 1
          fi

      - name: 🛠️ Build Server (Nitro)
        run: npm run build
        env:
          NITRO_PRESET: node-server
          NUXT_BUILD_COMMIT: ${{ github.sha }}

      - name: 📂 Copy MJML templates to server output
        run: |
          mkdir -p .output/server/server/services/mail/mjml/templates
          cp -r server/services/mail/mjml/templates/* .output/server/server/services/mail/mjml/templates/
          ls -la .output/server/server/services/mail/mjml/templates

      - name: 📂 Restore static site output
        run: |
          if [ -d "tmp/public-static" ]; then
            rm -rf .output/public
            mv tmp/public-static .output/public
            echo "Static site output restored to .output/public"
          else
            echo "Error: tmp/public-static does not exist"
            exit 1
          fi

      - name: 🧾 List generated pages
        run: |
          (cd .output/public && find . -type f \( -name 'index.html' -o -name '_payload.json' \) | sed 's|^\./||' | LC_ALL=C sort) > generated-pages.txt
          echo "Generated pages: $(wc -l < generated-pages.txt)"

      - name: 📤 Deploy static files to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: '.output/public/*'
          target: '/var/www/dibodev.fr/html'
          strip_components: 2

      - name: 📤 Upload generated pages list to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'generated-pages.txt'
          target: '/var/www/dibodev.fr'
          strip_components: 0

      - name: 📤 Deploy Nitro server to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: '.output/server/*'
          target: '/var/www/dibodev.fr/server'
          strip_components: 2

      - name: 📤 Deploy .env to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: '.env'
          target: '/var/www/dibodev.fr/server'
          strip_components: 0

      - name: 🛠️ Start Nitro server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Install Node.js if not already installed
            if ! command -v node &> /dev/null; then
              curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi
            # Install PM2 if not already installed
            if ! command -v pm2 &> /dev/null; then
              npm install -g pm2
            fi
            # Start Nitro server with PM2
            cd /var/www/dibodev.fr/server
            pm2 describe dibodev-nuxt-api > /dev/null 2>&1 && pm2 stop dibodev-nuxt-api || true
            PORT=3002 pm2 start index.mjs --name dibodev-nuxt-api
            pm2 save
            pm2 list
            # Restart Nginx
            sudo nginx -t
            sudo systemctl restart nginx

      # scp never deletes anything: pages renamed or removed since a previous build would stay online forever.
      - name: 🧹 Remove pages that are no longer generated
        continue-on-error: true
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/dibodev.fr/html
            generated=/var/www/dibodev.fr/generated-pages.txt
            generated_count=$(wc -l < "$generated")
            if [ "$generated_count" -lt 150 ]; then
              echo "Only $generated_count generated pages listed: prune skipped."
              exit 0
            fi
            find . -type f \( -name 'index.html' -o -name '_payload.json' \) | sed 's|^\./||' | LC_ALL=C sort > /tmp/dibodev-live-pages.txt
            LC_ALL=C comm -23 /tmp/dibodev-live-pages.txt "$generated" > /tmp/dibodev-stale-pages.txt
            stale_count=$(wc -l < /tmp/dibodev-stale-pages.txt)
            echo "Stale pages: $stale_count"
            cat /tmp/dibodev-stale-pages.txt
            if [ "$stale_count" -gt 60 ]; then
              echo "Unusually many stale pages: prune skipped, check the list above."
              exit 0
            fi
            while IFS= read -r file; do
              rm -f -- "$file"
              rmdir -p --ignore-fail-on-non-empty -- "$(dirname -- "$file")" 2>/dev/null || true
            done < /tmp/dibodev-stale-pages.txt

      # Tells Bing and the other IndexNow engines to recrawl the pages listed in the live sitemaps.
      - name: 📣 Notify search engines (IndexNow)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          key=$(tr -d '[:space:]' < public/indexnow-key.txt)
          for locale in fr-FR en-US es-ES; do
            curl -fsS "https://dibodev.fr/__sitemap__/$locale.xml"
          done | grep -o '<loc>https://dibodev.fr[^<]*</loc>' | sed -e 's|<loc>||' -e 's|</loc>||' | LC_ALL=C sort -u > indexnow-urls.txt
          echo "URLs submitted: $(wc -l < indexnow-urls.txt)"
          jq -n --arg key "$key" --rawfile urls indexnow-urls.txt \
            '{host: "dibodev.fr", key: $key, keyLocation: "https://dibodev.fr/indexnow-key.txt", urlList: ($urls | split("\n") | map(select(length > 0)))}' > indexnow.json
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' --data @indexnow.json
